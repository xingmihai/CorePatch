name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'gradle'

    - name: Write key
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
        echo releaseStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
        echo releaseKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
        echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
        echo releaseStoreFile='key.jks' >> gradle.properties
        echo ${{ secrets.SIGNING_KEY }} | base64 --decode > key.jks
        fi

    - name: Build with Gradle
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: outputs
        path: app/build/outputs/apk

    - name: Pre-release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        tag="pre-${{ github.run_number }}"
        apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
        [ -n "$apk" ] || { echo "no release apk"; exit 1; }
        fp=$(keytool -printcert -jarfile "$apk" 2>/dev/null | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
        [ -n "$fp" ] || { echo "未读到签名证书指纹"; exit 1; }
        echo "签名指纹: $fp"
        {
          echo "由 Android CI 自动构建的预发行版，对应 ${GITHUB_SHA}。"
          echo
          echo "**签名证书 SHA256**"
          echo '```'
          echo "$fp"
          echo '```'
          echo
          echo "**最近提交**"
          git log -5 --pretty='- %s (%h)'
        } > /tmp/notes.md
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" \
          --prerelease \
          --target "$GITHUB_SHA" \
          --title "Pre-release $tag (${GITHUB_SHA::7})" \
          --notes-file /tmp/notes.md \
          "$apk"
